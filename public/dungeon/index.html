<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hero Pull: Dungeon Run</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<meta name="fc:frame" content='{"version":"next","imageUrl":"https://hero-pull.vercel.app/og.png","button":{"title":"Play Dungeon Run!","action":{"type":"launch_frame","name":"Hero Pull: Dungeon Run","url":"https://hero-pull.vercel.app/dungeon","splashBackgroundColor":"#0a0a0f"}}}' />
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#0a0a0f;font-family:'Press Start 2P',monospace;color:#f0f0f0;overflow:hidden;}
#game{width:100vw;height:100vh;max-width:430px;margin:0 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;}
.screen.active{display:flex;}

/* Stars */
.star{position:absolute;background:#fff;border-radius:50%;}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

/* Title */
#title-screen{background:radial-gradient(ellipse at 50% 30%,#1a0a2e 0%,#0a0a0f 70%);}
.title-logo{font-size:26px;color:#ffd700;text-shadow:0 0 20px #ffd700,4px 4px 0 #7c5a00;line-height:1.3;text-align:center;margin-bottom:6px;animation:glow 2s ease-in-out infinite alternate;}
@keyframes glow{from{text-shadow:0 0 20px #ffd700,4px 4px 0 #7c5a00}to{text-shadow:0 0 40px #ffd700,0 0 80px #ffaa00,4px 4px 0 #7c5a00}}
.title-sub{font-size:9px;color:#c084fc;letter-spacing:4px;margin-bottom:28px;}
.title-chars{display:flex;gap:10px;margin-bottom:28px;}
.title-char{width:52px;height:52px;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:22px;animation:floatY 2s ease-in-out infinite;}
.tc-c{border-color:#9ca3af;background:rgba(156,163,175,.1);}
.tc-r{border-color:#60a5fa;background:rgba(96,165,250,.1);animation-delay:.3s;}
.tc-e{border-color:#c084fc;background:rgba(192,132,252,.1);animation-delay:.6s;}
.tc-l{border-color:#ffd700;background:rgba(255,215,0,.1);animation-delay:.9s;box-shadow:0 0 15px rgba(255,215,0,.3);}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.btn{font-family:'Press Start 2P',monospace;cursor:pointer;border:3px solid;background:transparent;position:relative;transition:all .1s;}
.btn:active{transform:translate(2px,2px);}
.btn-gold{color:#ffd700;border-color:#ffd700;padding:12px 24px;font-size:10px;}
.btn-gold:hover{background:#ffd700;color:#000;box-shadow:0 0 20px #ffd700;}
.btn-blue{color:#60a5fa;border-color:#60a5fa;padding:10px 16px;font-size:9px;}
.btn-blue:hover{background:#60a5fa;color:#000;}
.btn-red{color:#f87171;border-color:#f87171;padding:8px 12px;font-size:8px;}
.btn-red:hover{background:#f87171;color:#000;}
.btn-green{color:#4ade80;border-color:#4ade80;padding:8px 12px;font-size:8px;}
.btn-green:hover{background:#4ade80;color:#000;}
.btn-purple{color:#c084fc;border-color:#c084fc;padding:8px 12px;font-size:8px;}
.btn-purple:hover{background:#c084fc;color:#000;}
.hs-text{font-size:6px;color:#555;margin-top:12px;}

/* Hero Select */
#hero-select{background:#0a0a0f;gap:10px;}
.sel-title{font-size:10px;color:#ffd700;text-align:center;}
.sel-sub{font-size:6px;color:#666;text-align:center;}
.hero-cards{display:flex;gap:8px;width:100%;}
.hcard{flex:1;border:2px solid #444;padding:8px 4px;cursor:pointer;text-align:center;background:#0f0f1a;transition:all .2s;}
.hcard:hover{transform:translateY(-3px);}
.hcard.sel{transform:translateY(-5px) scale(1.04);}
.hcard.c{border-color:#9ca3af;}.hcard.r{border-color:#60a5fa;box-shadow:0 0 10px rgba(96,165,250,.3);}
.hcard.e{border-color:#c084fc;box-shadow:0 0 10px rgba(192,132,252,.3);}
.hcard.l{border-color:#ffd700;box-shadow:0 0 14px rgba(255,215,0,.4);animation:lpulse 2s infinite;}
@keyframes lpulse{0%,100%{box-shadow:0 0 14px rgba(255,215,0,.4)}50%{box-shadow:0 0 28px rgba(255,215,0,.7)}}
.hcard-rarity{font-size:5px;margin-bottom:4px;}
.hcard-char{font-size:28px;display:block;margin:4px 0;animation:floatY 2s ease-in-out infinite;}
.hcard-name{font-size:5px;line-height:1.6;margin:4px 0;}
.hcard-stats{font-size:4px;color:#777;line-height:2;}

/* Game Layout */
#game-screen{background:#0a0a0f;padding:0;justify-content:flex-start;}
.g-header{display:flex;justify-content:space-between;padding:6px 10px;background:#0f0f1a;border-bottom:2px solid #1e1e3a;flex-shrink:0;}
.g-hdr-item{font-size:6px;}
.g-floor{color:#ffd700;}.g-score{color:#4ade80;}.g-gold{color:#fbbf24;}

.g-body{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* Hero Panel */
.h-panel{padding:8px 10px;background:#0d0d20;border-bottom:2px solid #1e1e3a;flex-shrink:0;}
.h-panel-row{display:flex;gap:8px;align-items:flex-start;}
.h-char{font-size:36px;flex-shrink:0;animation:floatY 2s ease-in-out infinite;}
.h-info{flex:1;min-width:0;}
.h-name{font-size:6px;color:#ffd700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.h-rar{font-size:5px;margin-bottom:4px;}
.bar-row{margin-bottom:3px;}
.bar-lbl{font-size:4px;color:#888;margin-bottom:1px;}
.bar-out{height:6px;background:#1a1a2e;border:1px solid #333;}
.bar-in{height:100%;transition:width .4s;}
.hp-bar{background:linear-gradient(90deg,#dc2626,#ef4444);}
.mp-bar{background:linear-gradient(90deg,#2563eb,#7c3aed);}
.stats-row{display:flex;gap:6px;font-size:4px;color:#666;margin-top:3px;flex-wrap:wrap;}
.stats-row span{color:#ccc;}
.weap-slot{font-size:4px;color:#888;margin-top:2px;}

/* Room */
.room-area{flex:1;overflow-y:auto;padding:8px;}
.room-hdr{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.room-icon{font-size:18px;}
.room-title{font-size:8px;color:#fff;}
.room-desc{font-size:5px;color:#666;line-height:2;margin-bottom:8px;}

/* Battle */
.battle-stage{display:flex;justify-content:space-around;align-items:center;padding:8px 0;position:relative;background:#0d0d20;border:1px solid #1e1e3a;margin-bottom:8px;}
.comb{text-align:center;position:relative;}
.comb-name{font-size:5px;margin-bottom:4px;}
.comb-char{font-size:40px;display:block;animation:floatY 2s ease-in-out infinite;}
.comb-char.enemy-anim{animation:enemySway 1.5s ease-in-out infinite;}
@keyframes enemySway{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.e-hpbar{margin-top:4px;}
.vs{font-size:14px;color:#ef4444;font-weight:900;animation:vsPulse 1s infinite;}
@keyframes vsPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

.battle-log{background:#0a0a0f;border:1px solid #1e1e3a;padding:6px 8px;font-size:5px;color:#888;line-height:2;max-height:56px;overflow-y:auto;margin-bottom:8px;}
.lh{color:#f97316;}.lheal{color:#4ade80;}.lcrit{color:#ffd700;}
.battle-btns{display:flex;gap:6px;flex-wrap:wrap;}
.battle-btns .btn{flex:1;min-width:70px;font-size:6px;padding:8px 4px;text-align:center;}

/* Float damage */
.fdmg{position:absolute;font-family:'Press Start 2P',monospace;font-size:10px;pointer-events:none;animation:fdmgAnim .9s forwards;z-index:50;}
@keyframes fdmgAnim{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-50px);opacity:0}}

/* Item cards */
.item-card{background:#0f0f1a;border:2px solid #1e1e3a;padding:8px;margin:4px 0;display:flex;align-items:center;gap:8px;cursor:pointer;transition:border-color .2s;}
.item-card:hover{border-color:#ffd700;}
.ic-emoji{font-size:18px;}
.ic-info{flex:1;}
.ic-name{font-size:5px;color:#fff;margin-bottom:2px;}
.ic-stats{font-size:4px;color:#666;}
.ic-cost{font-size:5px;color:#ffd700;}
.big-emoji{font-size:40px;display:block;text-align:center;margin:6px 0;animation:floatY .6s ease-in-out infinite alternate;}
.box{background:#0f0f1a;border:2px solid #1e1e3a;padding:10px;text-align:center;margin-bottom:8px;}
.box-title{font-size:7px;color:#ffd700;margin-bottom:6px;}
.box-sub{font-size:5px;color:#888;line-height:2;margin-bottom:8px;}
.gold-bar{font-size:7px;color:#ffd700;margin-bottom:8px;}
.nxt{margin-top:6px;}

/* Game Over */
#gameover-screen{background:radial-gradient(ellipse at 50%,#1a0000 0%,#0a0a0f 70%);gap:10px;}
.skull{font-size:56px;animation:skullRot .6s ease-in-out infinite alternate;}
@keyframes skullRot{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.go-title{font-size:18px;color:#ef4444;text-shadow:0 0 20px #ef4444;}
.go-stats{background:#0f0f1a;border:2px solid #1e1e3a;padding:12px;width:100%;font-size:6px;line-height:2.5;}
.newrec{font-size:9px;color:#ffd700;animation:glow 1s infinite alternate;}
.go-btns{display:flex;gap:8px;width:100%;}
.go-btns .btn{flex:1;font-size:7px;padding:10px 4px;}

/* Victory */
#victory-screen{background:radial-gradient(ellipse at 50%,#1a1400 0%,#0a0a0f 70%);gap:10px;}
.v-title{font-size:13px;color:#ffd700;text-shadow:0 0 30px #ffd700;text-align:center;animation:glow 1.5s infinite alternate;}
.v-btns{display:flex;flex-direction:column;gap:6px;width:100%;}
.v-btns .btn{width:100%;font-size:7px;padding:10px;}

/* Damage flash overlay */
#flash{position:fixed;inset:0;background:rgba(220,38,38,0);pointer-events:none;z-index:999;transition:background .08s;}
#flash.on{background:rgba(220,38,38,.35);}

/* Shake/lunge */
.shake{animation:shk .25s;}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.lunge{animation:lng .25s;}
@keyframes lng{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
</style>
</head>
<body>
<div id="game">
<div id="flash"></div>

<!-- TITLE -->
<div id="title-screen" class="screen active">
  <div id="star-bg" style="position:absolute;inset:0;overflow:hidden;pointer-events:none;"></div>
  <div class="title-logo">HERO PULL</div>
  <div class="title-sub">⚔ DUNGEON RUN ⚔</div>
  <div class="title-chars">
    <div class="title-char tc-c">🧑</div>
    <div class="title-char tc-r">🦸</div>
    <div class="title-char tc-e">🦹</div>
    <div class="title-char tc-l">⚡</div>
  </div>
  <button class="btn btn-gold" onclick="goSelect()">▶ START RUN</button>
  <div class="hs-text" id="hs-txt"></div>
</div>

<!-- HERO SELECT -->
<div id="hero-select" class="screen">
  <div class="sel-title">⚔ CHOOSE YOUR HERO</div>
  <div class="sel-sub">Pick wisely — your fate depends on it</div>
  <div class="hero-cards" id="hero-cards"></div>
  <button class="btn btn-gold" id="start-btn" onclick="startRun()" disabled style="opacity:.4;margin-top:4px;">▶ ENTER DUNGEON</button>
  <button class="btn btn-blue" onclick="showScr('title-screen')" style="margin-top:4px;">◀ BACK</button>
</div>

<!-- GAME -->
<div id="game-screen" class="screen" style="padding:0;">
  <div class="g-header">
    <div class="g-hdr-item g-floor">🏰 FL.<span id="g-fl">1</span>/10</div>
    <div class="g-hdr-item g-score">⭐<span id="g-sc">0</span></div>
    <div class="g-hdr-item g-gold">🪙<span id="g-gd">0</span></div>
    <div class="g-hdr-item" style="color:#f97316;font-size:6px;">🧪<span id="g-pot">1</span></div>
  </div>
  <div class="g-body">
    <div class="h-panel">
      <div class="h-panel-row">
        <div class="h-char" id="h-char">🧑</div>
        <div class="h-info">
          <div class="h-name" id="h-name">Hero</div>
          <div class="h-rar" id="h-rar"></div>
          <div class="bar-row">
            <div class="bar-lbl">HP <span id="h-hp">100</span>/<span id="h-mhp">100</span></div>
            <div class="bar-out"><div class="bar-in hp-bar" id="h-hpbar" style="width:100%"></div></div>
          </div>
          <div class="bar-row">
            <div class="bar-lbl">MP <span id="h-mp">50</span>/50</div>
            <div class="bar-out"><div class="bar-in mp-bar" id="h-mpbar" style="width:100%"></div></div>
          </div>
          <div class="stats-row">
            <span>ATK <span id="h-atk">0</span></span>
            <span>DEF <span id="h-def">0</span></span>
            <span>SPD <span id="h-spd">0</span></span>
          </div>
          <div class="weap-slot" id="h-weap">⬜ No weapon</div>
        </div>
      </div>
    </div>
    <div class="room-area" id="room-area"></div>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameover-screen" class="screen">
  <div class="skull">💀</div>
  <div class="go-title">YOU DIED</div>
  <div class="newrec" id="newrec" style="display:none">🏆 NEW RECORD!</div>
  <div class="go-stats" id="go-stats"></div>
  <div class="go-btns">
    <button class="btn btn-gold" onclick="goSelect()">▶ RETRY</button>
    <button class="btn btn-blue" onclick="doShare()">📢 SHARE</button>
  </div>
  <button class="btn btn-purple" onclick="showScr('title-screen')" style="width:100%;margin-top:4px;font-size:7px;padding:8px;">🏠 TITLE</button>
</div>

<!-- VICTORY -->
<div id="victory-screen" class="screen">
  <div style="font-size:52px;animation:floatY 1s ease-in-out infinite alternate;">🏆</div>
  <div class="v-title">DUNGEON CLEARED!</div>
  <div style="font-size:7px;color:#4ade80;">You are a true champion!</div>
  <div class="go-stats" id="v-stats"></div>
  <div class="v-btns">
    <button class="btn btn-gold" onclick="mintVic()">⛓ MINT VICTORY (0.0002 ETH)</button>
    <button class="btn btn-blue" onclick="doShare()">📢 SHARE VICTORY</button>
    <button class="btn btn-purple" onclick="goSelect()">▶ PLAY AGAIN</button>
  </div>
</div>
</div>

<script>
// ═══ DATA ═══
const HEROES = [
  {name:'Shadow Viper',rarity:'common',emoji:'🐍',atk:38,def:22,spd:42,hp:80,power:'Poison Fang',color:'#9ca3af'},
  {name:'Iron Fist',rarity:'common',emoji:'👊',atk:42,def:32,spd:26,hp:90,power:'Power Smash',color:'#9ca3af'},
  {name:'Neon Falcon',rarity:'rare',emoji:'🦅',atk:46,def:28,spd:52,hp:100,power:'Lightning Dive',color:'#60a5fa'},
  {name:'Azure Spectre',rarity:'rare',emoji:'👻',atk:38,def:48,spd:34,hp:105,power:'Ice Barrier',color:'#60a5fa'},
  {name:'Storm Chaser',rarity:'rare',emoji:'⚡',atk:50,def:30,spd:55,hp:95,power:'Thunder Rush',color:'#60a5fa'},
  {name:'Crimson Phantom',rarity:'epic',emoji:'🔥',atk:58,def:38,spd:46,hp:125,power:'Dark Slash',color:'#c084fc'},
  {name:'Void Walker',rarity:'epic',emoji:'🌑',atk:62,def:34,spd:56,hp:120,power:'Shadow Step',color:'#c084fc'},
  {name:'Emerald Knight',rarity:'epic',emoji:'💚',atk:50,def:60,spd:36,hp:140,power:'Nature Guard',color:'#c084fc'},
  {name:'Golden Phoenix',rarity:'legendary',emoji:'🦅',atk:72,def:52,spd:62,hp:160,power:'Rebirth Flame',color:'#ffd700'},
  {name:'Silver Sentinel',rarity:'legendary',emoji:'⚔️',atk:66,def:72,spd:42,hp:170,power:'Holy Shield',color:'#ffd700'},
];

const ENEMIES = [
  {name:'Slime',emoji:'🟢',hp:28,atk:8,def:2,xp:10,gold:5},
  {name:'Bat',emoji:'🦇',hp:22,atk:12,def:1,xp:12,gold:6},
  {name:'Goblin',emoji:'👺',hp:48,atk:16,def:6,xp:22,gold:12},
  {name:'Skeleton',emoji:'💀',hp:55,atk:18,def:8,xp:25,gold:14},
  {name:'Orc Warrior',emoji:'👹',hp:90,atk:26,def:12,xp:45,gold:22},
  {name:'Dark Witch',emoji:'🧙',hp:75,atk:32,def:8,xp:48,gold:26},
  {name:'Stone Golem',emoji:'🗿',hp:130,atk:28,def:22,xp:60,gold:30},
  {name:'Shadow Drake',emoji:'🐲',hp:110,atk:35,def:16,xp:65,gold:35},
  {name:'DRAGON KING',emoji:'🐉',hp:220,atk:40,def:20,xp:600,gold:100},
];

const WEAPONS = [
  {name:'Rusty Sword',emoji:'⚔️',atk:6,def:0,spd:0,rarity:'common',cost:0},
  {name:'Wooden Shield',emoji:'🛡️',atk:0,def:8,spd:0,rarity:'common',cost:15},
  {name:'Steel Blade',emoji:'⚔️',atk:14,def:2,spd:0,rarity:'rare',cost:30},
  {name:'Iron Wall',emoji:'🛡️',atk:0,def:18,spd:0,rarity:'rare',cost:28},
  {name:'Swift Boots',emoji:'👢',atk:2,def:2,spd:18,rarity:'rare',cost:25},
  {name:'Shadow Slicer',emoji:'⚔️',atk:24,def:0,spd:8,rarity:'epic',cost:55},
  {name:'Void Barrier',emoji:'🛡️',atk:4,def:28,spd:4,rarity:'epic',cost:50},
  {name:'God Helmet',emoji:'⛑️',atk:8,def:14,spd:8,rarity:'epic',cost:48},
  {name:'Divine Sword',emoji:'⚔️',atk:38,def:8,spd:12,rarity:'legendary',cost:90},
  {name:'Celestial Shield',emoji:'🛡️',atk:6,def:38,spd:6,rarity:'legendary',cost:85},
];

// ═══ STATE ═══
let G = {};

function initG(hero) {
  G = {
    hero: {...hero, currentHp: hero.hp, maxHp: hero.hp, weapon: null},
    floor: 1, score: 0, gold: 0, mp: 50, potions: 1,
    inBattle: false, defending: false, playerTurn: true,
    enemy: null, turn: 0,
  };
}

// ═══ SCREENS ═══
function showScr(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ═══ INIT ═══
window.onload = () => {
  // Stars
  const bg = document.getElementById('star-bg');
  for(let i=0;i<55;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()<.25?2:1;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation:twinkle ${1+Math.random()*2}s ${Math.random()*2}s infinite;`;
    bg.appendChild(s);
  }
  const hs=localStorage.getItem('dungeon-hs')||0;
  const dp=localStorage.getItem('dungeon-dp')||0;
  document.getElementById('hs-txt').textContent=`BEST: ${hs}pts | DEEPEST: FL.${dp}`;
};

// ═══ HERO SELECT ═══
let selHero = null;

function goSelect() {
  selHero = null;
  const sb = document.getElementById('start-btn');
  sb.disabled=true; sb.style.opacity='.4';
  const picks = [...HEROES].sort(()=>Math.random()-.5).slice(0,3);
  const wrap = document.getElementById('hero-cards');
  wrap.innerHTML='';
  picks.forEach((h,i)=>{
    const d=document.createElement('div');
    const rc={common:'c',rare:'r',epic:'e',legendary:'l'}[h.rarity];
    d.className=`hcard ${rc}`;
    d.onclick=()=>selCard(i,h,d);
    d.innerHTML=`
      <div class="hcard-rarity" style="color:${h.color}">${h.rarity.toUpperCase()}</div>
      <span class="hcard-char">${h.emoji}</span>
      <div class="hcard-name">${h.name}</div>
      <div class="hcard-stats">❤️${h.hp} ⚔️${h.atk}<br>🛡️${h.def} ⚡${h.spd}<br>✨${h.power}</div>`;
    wrap.appendChild(d);
  });
  showScr('hero-select');
}

function selCard(i,h,el){
  document.querySelectorAll('.hcard').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  selHero=h;
  const sb=document.getElementById('start-btn');
  sb.disabled=false;sb.style.opacity='1';
}

// ═══ START ═══
function startRun(){
  if(!selHero)return;
  initG(selHero);
  updatePanel();
  showScr('game-screen');
  genRoom();
}

function updatePanel(){
  const h=G.hero;
  const w=h.weapon;
  document.getElementById('h-char').textContent=h.emoji;
  document.getElementById('h-name').textContent=h.name;
  document.getElementById('h-rar').innerHTML=`<span style="color:${h.color}">${h.rarity.toUpperCase()}</span>`;
  document.getElementById('h-hp').textContent=h.currentHp;
  document.getElementById('h-mhp').textContent=h.maxHp;
  document.getElementById('h-hpbar').style.width=(h.currentHp/h.maxHp*100)+'%';
  document.getElementById('h-mp').textContent=G.mp;
  document.getElementById('h-mpbar').style.width=(G.mp/50*100)+'%';
  document.getElementById('h-atk').textContent=h.atk+(w?w.atk:0);
  document.getElementById('h-def').textContent=h.def+(w?w.def:0);
  document.getElementById('h-spd').textContent=h.spd+(w?w.spd:0);
  document.getElementById('h-weap').textContent=w?`${w.emoji} ${w.name}`:'⬜ No weapon';
  document.getElementById('g-fl').textContent=G.floor;
  document.getElementById('g-sc').textContent=G.score;
  document.getElementById('g-gd').textContent=G.gold;
  document.getElementById('g-pot').textContent=G.potions;
}

// ═══ ROOM ═══
function genRoom(){
  if(G.floor>10){endGame(true);return;}
  const weights=G.floor===10
    ?[{t:'boss',w:1}]
    :[{t:'battle',w:50},{t:'treasure',w:20},{t:'shop',w:15},{t:'trap',w:10},{t:'blessing',w:5}];
  const tot=weights.reduce((a,b)=>a+b.w,0);
  let roll=Math.random()*tot,type='battle';
  for(const w of weights){roll-=w.w;if(roll<=0){type=w.t;break;}}
  renderRoom(type);
}

function renderRoom(type){
  const area=document.getElementById('room-area');
  const icons={battle:'⚔️',treasure:'💰',shop:'🏪',trap:'⚠️',blessing:'🌟',boss:'🐉'};
  const titles={battle:'BATTLE!',treasure:'TREASURE ROOM',shop:'MERCHANT SHOP',trap:'TRAP DETECTED!',blessing:'SACRED SHRINE',boss:'BOSS BATTLE!'};
  area.innerHTML=`<div class="room-hdr"><span class="room-icon">${icons[type]}</span><span class="room-title">${titles[type]}</span></div>`;
  
  if(type==='battle'||type==='boss') doBattleRoom(type==='boss',area);
  else if(type==='treasure') doTreasureRoom(area);
  else if(type==='shop') doShopRoom(area);
  else if(type==='trap') doTrapRoom(area);
  else doBlessing(area);
}

// ═══ BATTLE ═══
function getEnemy(boss){
  if(boss) return {...ENEMIES[8],currentHp:220,maxHp:220};
  let pool=[];
  if(G.floor<=3) pool=ENEMIES.slice(0,2);
  else if(G.floor<=6) pool=ENEMIES.slice(2,4);
  else pool=ENEMIES.slice(4,8);
  const base={...pool[Math.floor(Math.random()*pool.length)]};
  const scale=1+(G.floor-1)*0.14;
  base.hp=Math.floor(base.hp*scale);
  base.atk=Math.floor(base.atk*scale);
  base.currentHp=base.hp; base.maxHp=base.hp;
  return base;
}

function doBattleRoom(boss,area){
  G.enemy=getEnemy(boss);
  G.inBattle=true; G.playerTurn=true; G.defending=false; G.turn=0;
  
  area.innerHTML+=`
    <div class="battle-stage" id="bstage">
      <div class="comb" id="hcomb">
        <div class="comb-name" style="color:${G.hero.color}">${G.hero.name}</div>
        <span class="comb-char" id="hchar">${G.hero.emoji}</span>
      </div>
      <div class="vs">VS</div>
      <div class="comb" id="ecomb">
        <div class="comb-name" style="color:#ef4444">${G.enemy.name}</div>
        <span class="comb-char enemy-anim" id="echar">${G.enemy.emoji}</span>
        <div class="e-hpbar">
          <div class="bar-lbl">HP <span id="ehp">${G.enemy.currentHp}</span>/${G.enemy.hp}</div>
          <div class="bar-out" style="width:80px"><div class="bar-in hp-bar" id="ehpbar" style="width:100%"></div></div>
        </div>
      </div>
    </div>
    <div class="battle-log" id="blog">⚔️ ${G.enemy.name} appears! Your move...</div>
    <div class="battle-btns">
      <button class="btn btn-red" onclick="doAtk()">⚔️ ATTACK</button>
      <button class="btn btn-blue" onclick="doDef()">🛡️ DEFEND</button>
      <button class="btn btn-green" onclick="doPot()" id="potbtn">🧪 POTION(${G.potions})</button>
    </div>`;
}

function addLog(msg,cls=''){
  const log=document.getElementById('blog');
  if(!log)return;
  log.innerHTML+=`<br><span class="${cls}">${msg}</span>`;
  log.scrollTop=log.scrollHeight;
}

function spawnFloat(txt,color,isHero){
  const stage=document.getElementById('bstage');
  if(!stage)return;
  const el=document.createElement('div');
  el.className='fdmg';
  el.textContent=txt;
  el.style.cssText=`color:${color};${isHero?'left:15%':'right:15%'};top:30%;`;
  stage.appendChild(el);
  setTimeout(()=>el.remove(),900);
}

function doAtk(){
  if(!G.playerTurn||!G.inBattle)return;
  G.playerTurn=false; G.turn++;
  
  const wa=G.hero.weapon?G.hero.weapon.atk:0;
  const totalAtk=G.hero.atk+wa;
  const isCrit=Math.random()<0.15;
  let dmg=Math.floor(totalAtk*(0.75+Math.random()*.5));
  if(isCrit)dmg=Math.floor(dmg*1.9);
  dmg=Math.max(1,dmg-Math.floor(G.enemy.def*.45));
  
  // Lunge
  const hc=document.getElementById('hchar');
  if(hc){hc.classList.add('lunge');setTimeout(()=>hc.classList.remove('lunge'),280);}
  
  setTimeout(()=>{
    G.enemy.currentHp=Math.max(0,G.enemy.currentHp-dmg);
    spawnFloat(isCrit?`💥${dmg}!!`:`-${dmg}`,isCrit?'#ffd700':'#f97316',false);
    addLog(isCrit?`💥 CRITICAL! ${dmg} damage!`:`⚔️ You strike for ${dmg}.`,isCrit?'lcrit':'lh');
    updEnemyBar();
    
    const ec=document.getElementById('echar');
    if(ec){ec.classList.add('shake');setTimeout(()=>ec.classList.remove('shake'),280);}
    
    if(G.enemy.currentHp<=0){killEnemy();return;}
    
    // Special skill (MP cost)
    if(G.turn%3===0&&G.mp>=25){
      G.mp=Math.max(0,G.mp-25);
      const bonus=Math.floor(totalAtk*.55);
      G.enemy.currentHp=Math.max(0,G.enemy.currentHp-bonus);
      addLog(`✨ ${G.hero.power}! +${bonus} bonus!`,'lcrit');
      updEnemyBar();
      updatePanel();
      if(G.enemy.currentHp<=0){killEnemy();return;}
    }
    
    setTimeout(enemyTurn,650);
  },320);
}

function doDef(){
  if(!G.playerTurn||!G.inBattle)return;
  G.defending=true; G.playerTurn=false; G.turn++;
  addLog('🛡️ You take a defensive stance! DEF x2.','lheal');
  setTimeout(enemyTurn,650);
}

function doPot(){
  if(!G.playerTurn||!G.inBattle||G.potions<=0)return;
  G.potions--;
  const heal=Math.floor(G.hero.maxHp*.38);
  G.hero.currentHp=Math.min(G.hero.maxHp,G.hero.currentHp+heal);
  spawnFloat(`+${heal}`,'#4ade80',true);
  addLog(`🧪 Potion! Restored ${heal} HP.`,'lheal');
  updatePanel();
  const pb=document.getElementById('potbtn');
  if(pb)pb.textContent=`🧪 POTION(${G.potions})`;
  G.playerTurn=false; G.turn++;
  setTimeout(enemyTurn,650);
}

function enemyTurn(){
  if(!G.inBattle)return;
  const wd=G.hero.weapon?G.hero.weapon.def:0;
  const totalDef=G.hero.def+wd;
  let dmg=Math.floor(G.enemy.atk*(0.75+Math.random()*.5));
  if(G.defending){dmg=Math.floor(dmg*.45);G.defending=false;}
  dmg=Math.max(1,dmg-Math.floor(totalDef*.4));
  
  const ec=document.getElementById('echar');
  if(ec){ec.classList.add('lunge');setTimeout(()=>ec.classList.remove('lunge'),280);}
  
  // Flash damage
  const fl=document.getElementById('flash');
  fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),180);
  
  G.hero.currentHp=Math.max(0,G.hero.currentHp-dmg);
  spawnFloat(`-${dmg}`,'#ef4444',true);
  addLog(`👹 ${G.enemy.name} hits for ${dmg}!`,'lh');
  
  const hc=document.getElementById('hchar');
  if(hc){hc.classList.add('shake');setTimeout(()=>hc.classList.remove('shake'),280);}
  
  updatePanel();
  if(G.hero.currentHp<=0){endGame(false);return;}
  
  G.playerTurn=true;
  addLog('Your turn!');
}

function updEnemyBar(){
  const eb=document.getElementById('ehpbar');
  const ev=document.getElementById('ehp');
  if(eb)eb.style.width=(G.enemy.currentHp/G.enemy.hp*100)+'%';
  if(ev)ev.textContent=G.enemy.currentHp;
}

function killEnemy(){
  G.inBattle=false;
  const pts=G.enemy.xp*G.floor;
  const gld=G.enemy.gold+Math.floor(Math.random()*8);
  G.score+=pts; G.gold+=gld;
  if(Math.random()<.28){G.potions++;addLog('🧪 Found a potion!','lheal');}
  addLog(`💀 ${G.enemy.name} defeated! +${pts}pts +${gld}🪙`,'lheal');
  updatePanel();
  
  const area=document.getElementById('room-area');
  // Weapon drop
  if(Math.random()<.35){
    const w=WEAPONS[Math.floor(Math.random()*WEAPONS.length)];
    const rc={common:'#9ca3af',rare:'#60a5fa',epic:'#c084fc',legendary:'#ffd700'}[w.rarity];
    const wd=document.createElement('div');
    wd.className='item-card';
    wd.innerHTML=`<span class="ic-emoji">${w.emoji}</span><div class="ic-info"><div class="ic-name" style="color:${rc}">${w.name} [${w.rarity.toUpperCase()}]</div><div class="ic-stats">ATK+${w.atk} DEF+${w.def} SPD+${w.spd}</div></div>`;
    const eb2=document.createElement('button');
    eb2.className='btn btn-gold';
    eb2.style.cssText='font-size:5px;padding:4px 6px;';
    eb2.textContent='EQUIP';
    eb2.onclick=()=>{G.hero.weapon=w;updatePanel();eb2.textContent='✅';};
    wd.appendChild(eb2);
    area.appendChild(wd);
  }
  
  const nb=document.createElement('div');
  nb.className='nxt';
  nb.innerHTML=`<button class="btn btn-gold" onclick="nextFloor()" style="width:100%;font-size:8px;padding:10px;">▶ NEXT FLOOR (${G.floor+1}/10)</button>`;
  area.appendChild(nb);
  area.scrollTop=area.scrollHeight;
}

function nextFloor(){
  G.floor++;
  const heal=Math.floor(G.hero.maxHp*.12);
  G.hero.currentHp=Math.min(G.hero.maxHp,G.hero.currentHp+heal);
  G.mp=Math.min(50,G.mp+12);
  G.score+=50;
  updatePanel();
  genRoom();
}

// ═══ TREASURE ═══
function doTreasureRoom(area){
  const roll=Math.random();
  let content='';
  if(roll<.38){
    const gld=15+Math.floor(Math.random()*20)+G.floor*3;
    G.gold+=gld; G.score+=25; updatePanel();
    content=`<span class="big-emoji">💰</span><div style="font-size:7px;color:#ffd700">+${gld} Gold!</div><div style="font-size:5px;color:#666;margin-top:4px">A chest full of coins!</div>`;
  } else if(roll<.72){
    const w=WEAPONS[Math.floor(Math.random()*WEAPONS.length)];
    const rc={common:'#9ca3af',rare:'#60a5fa',epic:'#c084fc',legendary:'#ffd700'}[w.rarity];
    content=`<span class="big-emoji">${w.emoji}</span><div style="font-size:6px;color:${rc}">${w.name}</div><div style="font-size:5px;color:#666;margin-top:2px">${w.rarity.toUpperCase()} • ATK+${w.atk} DEF+${w.def} SPD+${w.spd}</div><button class="btn btn-gold" style="margin-top:8px;font-size:6px;padding:6px 12px;" onclick="equipAndNext(${JSON.stringify(w).replace(/"/g,'&quot;')})">⚔️ EQUIP &amp; CONTINUE</button>`;
  } else {
    const heal=Math.floor(G.hero.maxHp*.42);
    G.hero.currentHp=Math.min(G.hero.maxHp,G.hero.currentHp+heal);
    G.score+=20; updatePanel();
    content=`<span class="big-emoji">💊</span><div style="font-size:7px;color:#4ade80">+${heal} HP!</div><div style="font-size:5px;color:#666;margin-top:4px">A healing crystal!</div>`;
  }
  area.innerHTML+=`<div class="box">${content}</div>`;
  if(!content.includes('EQUIP')) area.innerHTML+=`<div class="nxt"><button class="btn btn-gold" onclick="nextFloor()" style="width:100%;font-size:8px;padding:10px;">▶ NEXT FLOOR</button></div>`;
}

function equipAndNext(w){G.hero.weapon=w;updatePanel();nextFloor();}

// ═══ SHOP ═══
function doShopRoom(area){
  const items=[...WEAPONS].sort(()=>Math.random()-.5).slice(0,3);
  area._shop=items;
  let html=items.map((w,i)=>{
    const rc={common:'#9ca3af',rare:'#60a5fa',epic:'#c084fc',legendary:'#ffd700'}[w.rarity];
    return `<div class="item-card" id="si${i}" onclick="buyShop(${i})">
      <span class="ic-emoji">${w.emoji}</span>
      <div class="ic-info"><div class="ic-name" style="color:${rc}">${w.name}</div><div class="ic-stats">${w.rarity.toUpperCase()} • ATK+${w.atk} DEF+${w.def} SPD+${w.spd}</div></div>
      <div class="ic-cost">🪙${w.cost}</div>
    </div>`;
  }).join('');
  area.innerHTML+=`<div class="box"><div class="box-title">🧙 Welcome, adventurer!</div><div class="gold-bar">Your Gold: 🪙${G.gold}</div>${html}</div><div class="nxt"><button class="btn btn-gold" onclick="nextFloor()" style="width:100%;font-size:8px;padding:10px;">▶ LEAVE SHOP</button></div>`;
  area._shopData=items;
}

function buyShop(i){
  const area=document.getElementById('room-area');
  const items=area._shopData;
  if(!items)return;
  const w=items[i];
  if(G.gold<w.cost){
    const el=document.getElementById(`si${i}`);
    if(el){el.style.borderColor='#ef4444';setTimeout(()=>el.style.borderColor='#1e1e3a',600);}
    return;
  }
  G.gold-=w.cost; G.hero.weapon=w; updatePanel();
  const el=document.getElementById(`si${i}`);
  if(el)el.innerHTML=`<span style="color:#4ade80;font-size:7px;padding:8px;">✅ EQUIPPED!</span>`;
}

// ═══ TRAP ═══
function doTrapRoom(area){
  area.innerHTML+=`<div class="box">
    <span class="big-emoji">🪤</span>
    <div class="box-title" style="color:#f97316">PRESSURE PLATE!</div>
    <div class="box-sub">A trap blocks your path.<br>What do you do?</div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-blue" onclick="trapDisarm()" style="flex:1;font-size:6px;padding:8px 4px;">🔧 DISARM<br>(55% success)</button>
      <button class="btn btn-red" onclick="trapTank()" style="flex:1;font-size:6px;padding:8px 4px;">💨 TANK IT<br>&amp; PUSH ON</button>
    </div>
  </div>`;
}

function trapDisarm(){
  const area=document.getElementById('room-area');
  if(Math.random()<.55){
    G.score+=30; G.gold+=12; updatePanel();
    area.innerHTML+=`<div class="box" style="border-color:#4ade80"><div style="color:#4ade80;font-size:7px">✅ DISARMED!<br>+30pts +12🪙</div></div>`;
  } else {
    const dmg=12+G.floor*5;
    G.hero.currentHp=Math.max(0,G.hero.currentHp-dmg);
    updatePanel();
    const fl=document.getElementById('flash');
    fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),200);
    if(G.hero.currentHp<=0){endGame(false);return;}
    area.innerHTML+=`<div class="box" style="border-color:#ef4444"><div style="color:#ef4444;font-size:7px">💥 FAILED! -${dmg}HP</div></div>`;
  }
  area.innerHTML+=`<div class="nxt"><button class="btn btn-gold" onclick="nextFloor()" style="width:100%;font-size:8px;padding:10px;">▶ NEXT FLOOR</button></div>`;
}

function trapTank(){
  const dmg=8+G.floor*3;
  G.hero.currentHp=Math.max(0,G.hero.currentHp-dmg);
  updatePanel();
  const fl=document.getElementById('flash');
  fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),200);
  const area=document.getElementById('room-area');
  if(G.hero.currentHp<=0){endGame(false);return;}
  area.innerHTML+=`<div class="box"><div style="color:#f97316;font-size:7px">💨 You rush through! -${dmg}HP</div></div><div class="nxt"><button class="btn btn-gold" onclick="nextFloor()" style="width:100%;font-size:8px;padding:10px;">▶ NEXT FLOOR</button></div>`;
}

// ═══ BLESSING ═══
function doBlessing(area){
  const bless=[
    {name:'Battle Fury',desc:'+18 ATK forever',fn:()=>G.hero.atk+=18},
    {name:'Iron Skin',desc:'+18 DEF forever',fn:()=>G.hero.def+=18},
    {name:'Life Surge',desc:'Max HP +35, full heal',fn:()=>{G.hero.maxHp+=35;G.hero.currentHp=G.hero.maxHp;}},
    {name:'Gold Rain',desc:'+60 Gold',fn:()=>G.gold+=60},
    {name:'Potion Cache',desc:'+2 Potions',fn:()=>G.potions+=2},
    {name:'Magic Refill',desc:'Full MP restore',fn:()=>G.mp=50},
  ];
  const b=bless[Math.floor(Math.random()*bless.length)];
  area.innerHTML+=`<div class="box">
    <span class="big-emoji">⭐</span>
    <div class="box-title">SACRED SHRINE</div>
    <div style="font-size:7px;color:#c084fc;margin-bottom:4px">${b.name}</div>
    <div class="box-sub">${b.desc}</div>
    <button class="btn btn-purple" onclick="acceptBless()" style="width:100%;font-size:7px;padding:10px;">🙏 ACCEPT BLESSING</button>
  </div>`;
  area._bless=b;
}

function acceptBless(){
  const area=document.getElementById('room-area');
  if(area._bless){area._bless.fn();updatePanel();}
  area.innerHTML+=`<div class="box" style="border-color:#c084fc"><div style="color:#c084fc;font-size:6px">✨ Blessed!</div></div><div class="nxt"><button class="btn btn-gold" onclick="nextFloor()" style="width:100%;font-size:8px;padding:10px;">▶ NEXT FLOOR</button></div>`;
}

// ═══ END ═══
function endGame(win){
  G.inBattle=false;
  const prevHs=parseInt(localStorage.getItem('dungeon-hs')||'0');
  const prevDp=parseInt(localStorage.getItem('dungeon-dp')||'0');
  const isNew=G.score>prevHs;
  if(isNew)localStorage.setItem('dungeon-hs',G.score);
  if(G.floor>prevDp)localStorage.setItem('dungeon-dp',G.floor);
  
  if(win){
    G.score+=500;
    document.getElementById('v-stats').innerHTML=`
      <div>🏰 Floors Cleared: 10/10</div>
      <div>⭐ Final Score: ${G.score}</div>
      <div>🪙 Gold Earned: ${G.gold}</div>
      <div>❤️ HP Left: ${G.hero.currentHp}/${G.hero.maxHp}</div>
      ${isNew?'<div style="color:#ffd700">🏆 NEW HIGH SCORE!</div>':''}`;
    showScr('victory-screen');
  } else {
    document.getElementById('go-stats').innerHTML=`
      <div>🏰 Floor Reached: ${G.floor}/10</div>
      <div>⭐ Score: ${G.score}</div>
      <div>🪙 Gold: ${G.gold}</div>
      <div>🗡️ Hero: ${G.hero.name}</div>`;
    document.getElementById('newrec').style.display=isNew?'block':'none';
    showScr('gameover-screen');
  }
}

function doShare(){
  const txt=`I reached Floor ${G.floor} in Hero Pull: Dungeon Run! 🏰⚔️\nScore: ${G.score}pts | Hero: ${G.hero?.name||'?'}\nCan you beat me? 👇\nhttps://hero-pull.vercel.app/dungeon`;
  window.open(`https://warpcast.com/~/compose?text=${encodeURIComponent(txt)}`,'_blank');
}

async function mintVic(){
  try{
    const p=(window).ethereum;
    if(!p){alert('No wallet!');return;}
    await p.request({method:'eth_requestAccounts'});
    await p.request({method:'eth_sendTransaction',params:[{to:'0xa782922Ff9c54F4264FD049189eC66940f528Eb0',value:'0x'+BigInt('200000000000000').toString(16),chainId:'0x'+Number(8453).toString(16)}]});
    alert('🏆 Victory NFT minted!');
  }catch(e){alert('Failed: '+e.message);}
}
